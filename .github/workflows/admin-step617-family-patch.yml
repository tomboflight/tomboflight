name: Admin Step 617 Family Patch

on:
  push:
    branches:
      - fix/admin-review-workbench
    paths:
      - .github/workflows/admin-step617-family-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/admin-review-workbench
          fetch-depth: 0
      - name: Apply Family Manager workbench patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          html = Path('admin-family-manager.html')
          text = html.read_text(encoding='utf-8')
          text = text.replace(
              '<link rel="stylesheet" href="styles.css?v=20260828-phase21-1" />',
              '<link rel="stylesheet" href="styles.css?v=20260828-phase21-1" />\n    <link rel="stylesheet" href="admin-specialist-workbench.css?v=20260909-step617" />',
              1,
          )
          text = text.replace('<body>', '<body class="admin-specialist-workbench" data-admin-workbench="family">', 1)
          text = text.replace(
              '<p data-admin-family-status>Loading family build tools...</p>',
              '<p data-admin-family-status>Choose a provisioned family build. No family record opens automatically.</p>\n              <div class="admin-workbench-explainer"><strong>How this works:</strong> select the family you intend to manage, then choose Load Family. Member, relationship, upload, and verification controls stay case-scoped to that loaded family.</div>',
              1,
          )
          text = text.replace(
              '''                <div>\n                  <div class="card-number">1</div>\n                  <h3>Loading</h3>\n                  <p class="card-copy">Family summary is loading.</p>\n                </div>''',
              '''                <div class="admin-workbench-empty">\n                  <h3>No family selected</h3>\n                  <p class="card-copy">Select a provisioned family build above and choose Load Family. No household data is displayed until you do.</p>\n                </div>''',
              1,
          )
          text = text.replace(
              '<script src="admin-family-manager.js?v=20260824-phase18"></script>',
              '<script src="admin-family-manager.js?v=20260909-step617"></script>',
              1,
          )
          html.write_text(text, encoding='utf-8')

          p = Path('admin-family-manager.js')
          src = p.read_text(encoding='utf-8')

          # Insert family-context safety helpers before upload preview rendering.
          marker = '  function buildUploadPreviewMarkup(upload) {'
          if src.count(marker) != 1:
              raise SystemExit('family manager: buildUploadPreviewMarkup marker mismatch')
          helpers = '''  function renderFamilyContextState(title, copy) {\n    const node = document.querySelector("[data-admin-family-summary]");\n    if (!node) return;\n    node.innerHTML = `<div class="admin-workbench-empty"><h3>${escapeHtml(title)}</h3><p class="card-copy">${escapeHtml(copy)}</p></div>`;\n  }\n\n  function setFamilyScopedControlsEnabled(enabled) {\n    document.querySelectorAll(\n      "[data-admin-member-form] input, [data-admin-member-form] textarea, [data-admin-member-form] button, " +\n      "[data-admin-relationship-form] select, [data-admin-relationship-form] input, [data-admin-relationship-form] button, " +\n      "[data-admin-photo-form] select, [data-admin-photo-form] input, [data-admin-photo-form] button, " +\n      "[data-admin-evidence-form] select, [data-admin-evidence-form] input, [data-admin-evidence-form] button, " +\n      "[data-admin-uploads-member], [data-admin-upload-category-filter], [data-admin-load-member-uploads]"\n    ).forEach(function (node) {\n      node.disabled = !enabled;\n      node.setAttribute("aria-disabled", enabled ? "false" : "true");\n    });\n  }\n\n  function clearFamilyContext(message) {\n    currentFamilyId = "";\n    currentGraph = { members: [], relationships: [] };\n    renderFamilyContextState(\n      "No family loaded",\n      message || "Choose a provisioned family build and select Load Family before making changes."\n    );\n    renderMembers(currentGraph);\n    renderRelationships(currentGraph);\n    populateRelationshipMemberSelects(currentGraph);\n    populateUploadMemberSelects(currentGraph);\n    renderMemberUploads([]);\n    setFamilyScopedControlsEnabled(false);\n  }\n\n'''
          src = src.replace(marker, helpers + marker, 1)

          # Replace unauthenticated inline image URL builder with a status-only placeholder.
          start = src.index('  function buildUploadPreviewMarkup(upload) {')
          end = src.index('  function renderMemberUploads(records) {', start)
          replacement = '''  function buildUploadPreviewMarkup(upload) {\n    const permissions = upload && typeof upload.permissions === "object" ? upload.permissions : {};\n    const previewReady = permissions.can_preview === true;\n    return `<div class="admin-secure-preview" data-admin-upload-preview-frame="${escapeHtml(upload.id || "")}">\n      <div class="admin-secure-preview-empty">\n        <strong>${previewReady ? "Protected preview ready" : "Protected preview not ready"}</strong>\n        <p>${previewReady ? "Choose Secure Preview to view this customer file inside Tomb of Light." : "The file remains private until scanning and durable private storage are complete. Use the appropriate review queue to prepare it."}</p>\n      </div>\n    </div>`;\n  }\n\n'''
          src = src[:start] + replacement + src[end:]

          # Replace member-upload card action block: no normal Download workflow.
          old = '''            <div class="inline-actions" style="margin-top: 1rem">\n              <button\n                class="btn btn-secondary"\n                type="button"\n                data-download-upload-id="${escapeHtml(upload.id || "")}"\n                data-download-upload-name="${escapeHtml(upload.original_filename || "download")}"\n              >\n                Download\n              </button>\n\n              <button\n                class="btn btn-secondary"\n                type="button"\n                data-delete-upload-id="${escapeHtml(upload.id || "")}"\n              >\n                Delete Upload\n              </button>\n            </div>'''
          new = '''            <div class="admin-file-state-grid">\n              <div><span>Security</span><strong>${escapeHtml(upload.scan_status || "Unknown")}</strong></div>\n              <div><span>Review</span><strong>${escapeHtml(upload.verification_status || upload.master_review_status || "Pending")}</strong></div>\n              <div><span>Private preview</span><strong>${upload.permissions && upload.permissions.can_preview ? "Ready" : "Not ready"}</strong></div>\n            </div>\n\n            <div class="inline-actions" style="margin-top: 1rem">\n              <button\n                class="btn btn-primary"\n                type="button"\n                data-secure-preview-upload-id="${escapeHtml(upload.id || "")}"\n                ${upload.permissions && upload.permissions.can_preview ? "" : "disabled"}\n              >\n                Secure Preview\n              </button>\n              ${upload.category === "member_photo" ? '<a class="btn btn-secondary" href="admin-portrait-review.html">Open Portrait Review</a>' : ''}\n              ${upload.category === "verification_evidence" ? '<a class="btn btn-secondary" href="admin-verification-review.html">Open Evidence Review</a>' : ''}\n              <button\n                class="btn btn-secondary"\n                type="button"\n                data-delete-upload-id="${escapeHtml(upload.id || "")}"\n              >\n                Delete Upload\n              </button>\n            </div>'''
          if src.count(old) != 1:
              raise SystemExit(f'family manager: upload action block expected once, found {src.count(old)}')
          src = src.replace(old, new, 1)

          # Make family selection transactional: do not retain stale loaded family on a new selection or failed load.
          old = '''    try {\n      clearStatus(actionNode);\n      currentFamilyId = familyId;\n\n      const graph = await app.apiRequest(\n        `/families/${encodeURIComponent(familyId)}/graph`,\n        { method: "GET" },\n      );\n\n      currentGraph = {'''
          new = '''    try {\n      clearStatus(actionNode);\n      currentFamilyId = "";\n      currentGraph = { members: [], relationships: [] };\n      setFamilyScopedControlsEnabled(false);\n      renderFamilyContextState("Loading selected family", "Retrieving the isolated family graph and permissions…");\n\n      const graph = await app.apiRequest(\n        `/families/${encodeURIComponent(familyId)}/graph`,\n        { method: "GET" },\n      );\n\n      currentFamilyId = familyId;\n      currentGraph = {'''
          if src.count(old) != 1:
              raise SystemExit('family manager: load graph start mismatch')
          src = src.replace(old, new, 1)

          old = '''      renderSummary(currentGraph);\n      renderMembers(currentGraph);\n      renderRelationships(currentGraph);\n      populateRelationshipMemberSelects(currentGraph);\n      populateUploadMemberSelects(currentGraph);'''
          new = '''      renderSummary(currentGraph);\n      renderMembers(currentGraph);\n      renderRelationships(currentGraph);\n      populateRelationshipMemberSelects(currentGraph);\n      populateUploadMemberSelects(currentGraph);\n      setFamilyScopedControlsEnabled(true);'''
          if src.count(old) != 1:
              raise SystemExit('family manager: render graph success mismatch')
          src = src.replace(old, new, 1)

          old = '''    } catch (error) {\n      console.error("Family graph load failed:", error);\n      setStatus(\n        actionNode,\n        getUserFacingErrorMessage(error, "Unable to load family graph."),\n        "error",\n      );\n    }\n  }\n\n  async function loadMemberUploads()'''
          new = '''    } catch (error) {\n      console.error("Family graph load failed:", error);\n      currentFamilyId = "";\n      currentGraph = { members: [], relationships: [] };\n      setFamilyScopedControlsEnabled(false);\n      renderFamilyContextState(\n        "Family unavailable",\n        "The selected family could not be loaded. No family-scoped action is enabled. Retry the selection or return to Control Center."\n      );\n      setStatus(\n        actionNode,\n        getUserFacingErrorMessage(error, "Unable to load family graph."),\n        "error",\n      );\n    }\n  }\n\n  async function loadMemberUploads()'''
          if src.count(old) != 1:
              raise SystemExit('family manager: load graph catch mismatch')
          src = src.replace(old, new, 1)

          # Replace forced download function with authenticated inline protected preview.
          start = src.index('  async function downloadUpload(uploadId, originalFilename) {')
          end = src.index('  async function deleteUpload(uploadId) {', start)
          replacement = '''  async function securePreviewUpload(uploadId, button) {\n    const actionNode = document.querySelector("[data-admin-family-action-status]");\n    if (!uploadId) {\n      setStatus(actionNode, "Missing upload id.", "error");\n      return;\n    }\n\n    try {\n      setStatus(actionNode, "Loading protected customer file inside Family Manager…", "info");\n      const token = app.getToken ? app.getToken() : "";\n      const apiBaseUrl = typeof app.getApiBaseUrl === "function" ? app.getApiBaseUrl() : "";\n      const response = await fetch(\n        `${apiBaseUrl}/uploads/${encodeURIComponent(uploadId)}/admin-preview`,\n        { credentials: "include", headers: token ? { Authorization: `Bearer ${token}` } : {} },\n      );\n      if (!response.ok) {\n        let detail = "Protected preview is not available yet.";\n        try {\n          const payload = await response.json();\n          detail = String(payload && payload.detail || detail);\n        } catch (_error) {}\n        throw new Error(detail);\n      }\n      const blob = await response.blob();\n      const url = URL.createObjectURL(blob);\n      const card = button && button.closest(".family-record-card");\n      const frame = card && card.querySelector(`[data-admin-upload-preview-frame="${CSS.escape(String(uploadId))}"]`);\n      if (!frame) {\n        URL.revokeObjectURL(url);\n        throw new Error("Protected preview area is unavailable.");\n      }\n      const previous = frame.dataset.previewObjectUrl || "";\n      if (previous) URL.revokeObjectURL(previous);\n      frame.dataset.previewObjectUrl = url;\n      frame.innerHTML = "";\n      const type = String(blob.type || "").toLowerCase();\n      if (type.startsWith("image/")) {\n        const image = document.createElement("img");\n        image.src = url;\n        image.alt = "Protected customer upload preview";\n        frame.appendChild(image);\n      } else if (type === "application/pdf") {\n        const iframe = document.createElement("iframe");\n        iframe.src = url;\n        iframe.title = "Protected customer document preview";\n        frame.appendChild(iframe);\n      } else {\n        const empty = document.createElement("div");\n        empty.className = "admin-secure-preview-empty";\n        empty.textContent = "This protected file type cannot be rendered inline in this browser.";\n        frame.appendChild(empty);\n      }\n      setStatus(actionNode, "Protected customer file is visible inside Family Manager.", "success");\n    } catch (error) {\n      console.error("Secure upload preview failed:", error);\n      setStatus(actionNode, getUserFacingErrorMessage(error, "Unable to open protected preview."), "error");\n    }\n  }\n\n'''
          src = src[:start] + replacement + src[end:]

          # Bind secure-preview action instead of download.
          old = '''        const downloadButton = event.target.closest(\n          "[data-download-upload-id]",\n        );\n        if (downloadButton) {\n          downloadUpload(\n            downloadButton.getAttribute("data-download-upload-id"),\n            downloadButton.getAttribute("data-download-upload-name"),\n          );\n          return;\n        }'''
          new = '''        const securePreviewButton = event.target.closest(\n          "[data-secure-preview-upload-id]",\n        );\n        if (securePreviewButton) {\n          securePreviewUpload(\n            securePreviewButton.getAttribute("data-secure-preview-upload-id"),\n            securePreviewButton,\n          );\n          return;\n        }'''
          if src.count(old) != 1:
              raise SystemExit('family manager: download binding mismatch')
          src = src.replace(old, new, 1)

          # Initial and selection-change behavior must never leave stale family context active.
          old = '''      const selectNode = document.querySelector("[data-admin-family-select]");\n      if (selectNode && selectNode.value) {\n        await loadFamilyGraph();\n      }'''
          new = '''      const selectNode = document.querySelector("[data-admin-family-select]");\n      setFamilyScopedControlsEnabled(false);\n      if (selectNode) {\n        selectNode.addEventListener("change", function () {\n          clearFamilyContext(\n            selectNode.value\n              ? "The family selection changed. Choose Load Family to open that family before making changes."\n              : "Choose a provisioned family build and select Load Family before making changes."\n          );\n        });\n      }\n      if (selectNode && selectNode.value) {\n        await loadFamilyGraph();\n      } else {\n        clearFamilyContext();\n      }'''
          if src.count(old) != 1:
              raise SystemExit('family manager: initial family selection mismatch')
          src = src.replace(old, new, 1)

          p.write_text(src, encoding='utf-8')
          PY

      - name: Commit exact Family Manager patch and remove staging workflow
        shell: bash
        run: |
          rm -f .github/workflows/admin-step617-family-patch.yml
          git config user.name "tomboflight"
          git config user.email "thetomboflight@gmail.com"
          git add admin-family-manager.html admin-family-manager.js .github/workflows/admin-step617-family-patch.yml
          git diff --cached --check
          git commit -m "Admin: make Family Manager explicit and preview-first"
          git push origin HEAD:fix/admin-review-workbench
