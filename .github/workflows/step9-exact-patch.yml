name: Step 9 Exact Upload Truth Patch

on:
  push:
    branches:
      - fix/step9-upload-infrastructure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/step9-upload-infrastructure
          fetch-depth: 0
      - name: Apply exact Step 9 replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Protected upload surfaces must consume the current hardened shared assets.
          replace_exact('upload-hub.html', 'app.js?v=20260828-phase21-1', 'app.js?v=20260907-auth-hardening')
          replace_exact('upload-hub.html', 'auth.js?v=20260828-phase21-1', 'auth.js?v=20260907-auth-hardening')
          replace_exact('portrait-upload.html', 'app.js?v=20260828-phase21-1', 'app.js?v=20260907-auth-hardening')
          replace_exact('portrait-upload.html', 'auth.js?v=20260829-phase22', 'auth.js?v=20260907-auth-hardening')
          replace_exact('portrait-upload.html', 'portrait-upload.js?v=20260829-phase22', 'portrait-upload.js?v=20260909-step9')
          replace_exact('verification-upload.html', 'app.js?v=20260828-phase21-1', 'app.js?v=20260907-auth-hardening')
          replace_exact('verification-upload.html', 'auth.js?v=20260829-phase22', 'auth.js?v=20260907-auth-hardening')
          replace_exact('verification-upload.html', 'verification-upload.js?v=20260829-phase22', 'verification-upload.js?v=20260909-step9')
          replace_exact('vault-upload.html', 'app.js?v=20260828-phase21-1', 'app.js?v=20260907-auth-hardening')
          replace_exact('vault-upload.html', 'auth.js?v=20260829-phase22', 'auth.js?v=20260907-auth-hardening')

          old_portrait = '''  function uploadStatusLabel(upload) {
            if (upload.quarantined) return "quarantined — under security review";
            const vs = String(upload.verification_status || "").toLowerCase();
            if (vs === "rejected") return "rejected";
            if (vs === "needs_correction") return "needs correction";
            if (upload.approved_for_cinematic) return "approved for cinematic use";
            if (vs === "approved") return "approved";
            if (vs === "pending") return "pending review";
            if (upload.id || upload._id) return "uploaded";
            return "pending review";
          }'''.replace('          ', '')
          new_portrait = '''  function uploadStatusLabel(upload) {
            const scanStatus = normalizeValue(upload.scan_status);
            if (upload.quarantined) return "blocked — security review required";
            if (scanStatus === "infected") return "blocked — unsafe file detected";
            if (scanStatus === "error" || scanStatus === "skipped") {
              return "blocked — security review required";
            }
            if (!scanStatus || scanStatus === "pending") return "security scan in progress";
            if (scanStatus !== "clean") return "security status unavailable";

            const vs = normalizeValue(upload.verification_status);
            if (vs === "rejected") return "rejected";
            if (vs === "needs_correction") return "needs correction";
            if (upload.approved_for_cinematic) return "approved for cinematic use";
            if (vs === "approved") return "approved";
            if (vs === "pending") return "pending review";
            if (upload.id || upload._id) return "uploaded";
            return "pending review";
          }'''.replace('          ', '')
          replace_exact('portrait-upload.js', old_portrait, new_portrait)

          old_verification = '''  function uploadStatusLabel(upload) {
            if (upload.quarantined) return "quarantined — under security review";
            const vs = String(upload.verification_status || "").toLowerCase();
            const cat = String(upload.category || upload.asset_type || "").toLowerCase();
            if (vs === "rejected") return "rejected";
            if (vs === "needs_correction") return "needs correction";
            if (vs === "approved") {
              if (cat === "verification_evidence") return "approved for verification";
              return "approved";
            }
            if (vs === "pending") return "pending review";
            if (upload.id || upload._id) return "uploaded";
            return "pending review";
          }'''.replace('          ', '')
          new_verification = '''  function uploadStatusLabel(upload) {
            const scanStatus = normalizeValue(upload.scan_status);
            if (upload.quarantined) return "blocked — security review required";
            if (scanStatus === "infected") return "blocked — unsafe file detected";
            if (scanStatus === "error" || scanStatus === "skipped") {
              return "blocked — security review required";
            }
            if (!scanStatus || scanStatus === "pending") return "security scan in progress";
            if (scanStatus !== "clean") return "security status unavailable";

            const vs = normalizeValue(upload.verification_status);
            const cat = normalizeValue(upload.category || upload.asset_type);
            if (vs === "rejected") return "rejected";
            if (vs === "needs_correction") return "needs correction";
            if (vs === "approved") {
              if (cat === "verification_evidence") return "approved for verification";
              return "approved";
            }
            if (vs === "pending") return "pending review";
            if (upload.id || upload._id) return "uploaded";
            return "pending review";
          }'''.replace('          ', '')
          replace_exact('verification-upload.js', old_verification, new_verification)

          test_path = Path('backend/tests/test_step9_upload_infrastructure_truth.py')
          if test_path.exists():
              raise SystemExit(f'{test_path}: file already exists')
          test_path.write_text('''from pathlib import Path\n\n\nREPO_ROOT = Path(__file__).resolve().parents[2]\n\n\ndef _read(path: str) -> str:\n    return (REPO_ROOT / path).read_text(encoding="utf-8")\n\n\ndef test_protected_upload_surfaces_use_hardened_shared_assets():\n    for path in (\n        "upload-hub.html",\n        "portrait-upload.html",\n        "verification-upload.html",\n        "vault-upload.html",\n    ):\n        html = _read(path)\n        assert "app.js?v=20260907-auth-hardening" in html\n        assert "auth.js?v=20260907-auth-hardening" in html\n\n    assert "portrait-upload.js?v=20260909-step9" in _read("portrait-upload.html")\n    assert "verification-upload.js?v=20260909-step9" in _read("verification-upload.html")\n    # Vault source was not changed in this slice, so its asset identity must remain asset-specific.\n    assert "vault-upload.js?v=20260829-phase22" in _read("vault-upload.html")\n\n\ndef test_portrait_inventory_security_state_precedes_review_state():\n    source = _read("portrait-upload.js")\n    function_start = source.index("function uploadStatusLabel(upload)")\n    function_end = source.index("function uploadResponseState", function_start)\n    labeler = source[function_start:function_end]\n\n    assert 'const scanStatus = normalizeValue(upload.scan_status)' in labeler\n    assert 'scanStatus === "infected"' in labeler\n    assert 'scanStatus === "error" || scanStatus === "skipped"' in labeler\n    assert 'scanStatus !== "clean"' in labeler\n    assert labeler.index('scanStatus === "error"') < labeler.index('const vs = normalizeValue')\n    assert labeler.index('scanStatus !== "clean"') < labeler.index('vs === "pending"')\n    assert 'blocked — security review required' in labeler\n    assert 'security scan in progress' in labeler\n\n\ndef test_verification_inventory_security_state_precedes_review_state():\n    source = _read("verification-upload.js")\n    function_start = source.index("function uploadStatusLabel(upload)")\n    function_end = source.index("function uploadResponseState", function_start)\n    labeler = source[function_start:function_end]\n\n    assert 'const scanStatus = normalizeValue(upload.scan_status)' in labeler\n    assert 'scanStatus === "infected"' in labeler\n    assert 'scanStatus === "error" || scanStatus === "skipped"' in labeler\n    assert 'scanStatus !== "clean"' in labeler\n    assert labeler.index('scanStatus === "error"') < labeler.index('const vs = normalizeValue')\n    assert labeler.index('scanStatus !== "clean"') < labeler.index('vs === "pending"')\n    assert 'blocked — security review required' in labeler\n    assert 'security scan in progress' in labeler\n''', encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/step9-exact-patch.yml
          git config user.name "tomboflight"
          git config user.email "thetomboflight@gmail.com"
          git add upload-hub.html portrait-upload.html verification-upload.html vault-upload.html portrait-upload.js verification-upload.js backend/tests/test_step9_upload_infrastructure_truth.py .github/workflows/step9-exact-patch.yml
          git commit -m "Step 9: harden upload asset and security status truth"
          git push origin HEAD:fix/step9-upload-infrastructure
