name: Step 8.1 Finalize

on:
  push:
    branches:
      - fix/step8-1-customer-portal-architecture
    paths:
      - .github/workflows/step8-1-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/step8-1-customer-portal-architecture
          fetch-depth: 0
      - name: Apply exact Step 8.1 replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:90]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          replace_exact(
              "dashboard.html",
              'dashboard-step8.js?v=20260907-step8',
              'dashboard-step8.js?v=20260908-step8-1',
          )
          replace_exact(
              "dashboard-step8.js",
              'const STEP81_STYLE_HREF = "dashboard-step8-1.css?v=20260907-step8-1";',
              'const STEP81_STYLE_HREF = "dashboard-step8-1.css?v=20260908-step8-1";',
          )
          replace_exact(
              "backend/tests/test_step8_customer_dashboard_truth.py",
              "truth = 'dashboard-step8.js?v=20260907-step8'",
              "truth = 'dashboard-step8.js?v=20260908-step8-1'",
          )
          replace_exact(
              "browser-tests/dashboard-admin.spec.mjs",
              'dashboard-step8.js?v=20260907-step8',
              'dashboard-step8.js?v=20260908-step8-1',
          )

          replace_exact(
              "dashboard-step8.js",
              '''    if (!domStatus || domStatus === "not submitted" || domStatus === "unavailable") {\n      return domStatus === "not submitted" ? "not_started" : "";\n    }''',
              '''    if (!domStatus) return "";\n    if (domStatus === "not submitted") return "not_started";\n    if (domStatus === "unavailable") return "unavailable";''',
          )
          replace_exact(
              "dashboard-step8.js",
              '''    if (normalized === "rejected") return "Intake needs attention";\n    return "Workspace active";''',
              '''    if (normalized === "rejected") return "Intake needs attention";\n    if (normalized === "unavailable") return "Project status unavailable";\n    return "Workspace active";''',
          )
          replace_exact(
              "dashboard-step8.js",
              '''    const normalized = normalizeValue(status);\n    if (!normalized || normalized === "not_started") {''',
              '''    const normalized = normalizeValue(status);\n    if (normalized === "unavailable") {\n      return {\n        title: "Project status unavailable",\n        copy: "Tomb of Light could not confirm the current project state. Refresh before taking a workflow action.",\n        label: "Refresh Home",\n        href: "dashboard.html",\n      };\n    }\n    if (!normalized || normalized === "not_started") {''',
          )
          replace_exact(
              "dashboard-step8.js",
              '''    if (!normalized || normalized === "not_started" || normalized === "rejected") {\n      markCurrent(0);\n      return steps;\n    }''',
              '''    if (normalized === "unavailable") {\n      return steps;\n    }\n    if (!normalized || normalized === "not_started" || normalized === "rejected") {\n      markCurrent(0);\n      return steps;\n    }''',
          )
          replace_exact(
              "dashboard-step8.js",
              '''  function getHomeAlert(context, status) {\n    const maintenance = getMaintenancePresentation(context && context.maintenance);''',
              '''  function getHomeAlert(context, status) {\n    const maintenance = getMaintenancePresentation(context && context.maintenance);\n    if (normalizeValue(status) === "unavailable") {\n      return {\n        kind: "warning",\n        title: "Project status unavailable",\n        copy: "The current project state could not be confirmed. Refresh before continuing workflow actions.",\n      };\n    }''',
          )

          Path(".github/workflows/step8-1-finalize.yml").unlink()
          PY
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "Larry Robinson"
          git config user.email "thetomboflight@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Step 8.1: finalize cache identity and fail-closed Home state"
          git push origin HEAD:fix/step8-1-customer-portal-architecture
