name: Auth Step 4 One-Time Patch

on:
  push:
    branches:
      - fix/auth-session-hardening-step4

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/auth-session-hardening-step4
      - name: Apply exact auth hardening edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "app.js",
              '''  async function logoutUser() {
    // Clear the local session immediately so the caller is not blocked on the
    // network round-trip.  The backend call is best-effort: we still attempt it
    // so the server-side httpOnly auth cookie is revoked, but a slow or failing
    // backend cannot prevent the user from being logged out locally.
    clearSession();
    try {
      await apiRequest("/auth/logout", {
        method: "POST",
      });
    } catch (_error) {
      // Ignore – local session already cleared above.
    }
  }
''',
              '''  async function logoutUser(options = {}) {
    // Capture the bearer credential before local cleanup. If the same-origin
    // gateway is unavailable, apiRequest can still authenticate its direct
    // backend fallback and revoke the server-side session-token version.
    const revocationToken = getToken();
    const headers = { ...(options.headers || {}) };
    if (revocationToken && !headers.Authorization) {
      headers.Authorization = `Bearer ${revocationToken}`;
    }

    // Local logout is immediate; the captured credential exists only in this
    // function long enough to complete the server-side revocation attempt.
    clearSession();
    try {
      await apiRequest("/auth/logout", {
        ...options,
        method: "POST",
        headers,
      });
      return true;
    } catch (_error) {
      return false;
    }
  }
''',
          )

          replace_once(
              "auth.js",
              '''  function bindLogoutButtons() {
    if (hasLogoutBinding) return;
    hasLogoutBinding = true;

    document.addEventListener("click", function (event) {
      const button = event.target.closest("[data-logout-btn]");
      if (!button) return;

      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;

      // Clear the local session immediately so the redirect is not blocked by
      // network latency or a backend timeout (the API call can take up to 15 s).
      try {
        if (app && typeof app.clearSession === "function") {
          app.clearSession();
        }
      } catch (_error) {
        // Best-effort local cleanup.
      }

      clearCachedDashboardContext();

      // Notify the backend in the background — do not await.  The local session
      // is already cleared, so the user is logged out regardless of the outcome.
      if (app && typeof app.logoutUser === "function") {
        app.logoutUser().catch(function (err) {
          console.warn("Background logout request failed:", err);
        });
      }

      window.location.href = "signin.html";
    });
  }
''',
              '''  function bindLogoutButtons() {
    if (hasLogoutBinding) return;
    hasLogoutBinding = true;

    document.addEventListener("click", async function (event) {
      const button = event.target.closest("[data-logout-btn]");
      if (!button) return;

      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      clearCachedDashboardContext();

      // Give the authenticated revocation request a bounded opportunity to
      // complete before navigation. logoutUser clears the local credential
      // immediately after capturing it, so the browser is locally signed out
      // even while the server-side revocation request is finishing.
      const controller =
        typeof AbortController === "function" ? new AbortController() : null;
      const timeoutId = window.setTimeout(function () {
        if (controller) controller.abort();
      }, 10000);

      try {
        if (app && typeof app.logoutUser === "function") {
          await app.logoutUser(controller ? { signal: controller.signal } : {});
        } else if (app && typeof app.clearSession === "function") {
          app.clearSession();
        }
      } catch (err) {
        console.warn("Logout revocation request failed:", err);
      } finally {
        window.clearTimeout(timeoutId);
        try {
          if (app && typeof app.clearSession === "function") {
            app.clearSession();
          }
        } catch (_error) {
          // Best-effort local cleanup.
        }
        window.location.href = "signin.html";
      }
    });
  }
''',
          )

          replace_once(
              "backend/app/routes/auth.py",
              '''@router.post("/password-reset/request", response_model=PasswordResetResponse)
def password_reset_request_route(payload: PasswordResetRequest, response: Response):
    _enforce_rate_limit_with_audit(
        scope="auth_password_reset_request",
        key=payload.email.lower(),
''',
              '''@router.post("/password-reset/request", response_model=PasswordResetResponse)
def password_reset_request_route(
    payload: PasswordResetRequest,
    request: Request,
    response: Response,
):
    _enforce_rate_limit_with_audit(
        scope="auth_password_reset_request",
        key=_rate_key_from_request(request, principal=payload.email),
''',
          )
          PY
      - name: Commit hardening edits
        shell: bash
        run: |
          git config user.name "Tomb of Light CI"
          git config user.email "actions@users.noreply.github.com"
          git add app.js auth.js backend/app/routes/auth.py
          git commit -m "fix(auth): preserve server revocation and scope reset throttling"
          git push origin HEAD:fix/auth-session-hardening-step4
