name: Apply Step 6 Logout Remediation

on:
  push:
    branches:
      - audit-remediation/06-logout-revocation-integrity

permissions:
  contents: write

jobs:
  apply-remediation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply audited source corrections
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("backend/scripts/apply_step6_logout_revocation.py")
          spec = importlib.util.spec_from_file_location("step6_applicator", path)
          if spec is None or spec.loader is None:
              raise RuntimeError("Unable to load Step 6 applicator.")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          broken = 'return "\n".join('
          fixed = 'return "\\n".join('
          if module.TEST_CONTENT.count(broken) != 1:
              raise RuntimeError("Unable to locate generated newline join.")
          module.TEST_CONTENT = module.TEST_CONTENT.replace(broken, fixed, 1)
          module.main()
          PY

      - name: Validate syntax and patch integrity
        run: |
          python -m compileall backend/app backend/tests/test_logout_revocation_integrity.py
          git diff --check

      - name: Commit corrected implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No remediation changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routes/auth.py \
            backend/app/services/auth_service.py \
            backend/tests/test_logout_revocation_integrity.py
          git commit -m "Fix logout session revocation integrity"
          git push origin "HEAD:${GITHUB_REF_NAME}"
