name: Step 9 Cache Contract Alignment

on:
  push:
    branches:
      - fix/step9-upload-infrastructure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/step9-upload-infrastructure
          fetch-depth: 0
      - name: Align stale upload cache contracts only
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              'backend/tests/contracts/test_continuity_kernel_phase9_control_surface_security.py',
              '''APP_CACHE_REVISION_OVERRIDES = {\n    "dashboard.html": "20260907-auth-hardening",\n    "portal-section.html": "20260907-auth-hardening",\n}''',
              '''APP_CACHE_REVISION_OVERRIDES = {\n    "dashboard.html": "20260907-auth-hardening",\n    "portal-section.html": "20260907-auth-hardening",\n    "upload-hub.html": "20260907-auth-hardening",\n    "portrait-upload.html": "20260907-auth-hardening",\n    "verification-upload.html": "20260907-auth-hardening",\n    "vault-upload.html": "20260907-auth-hardening",\n}''',
          )

          replace_exact(
              'backend/tests/contracts/test_phase13_family_operating_machine.py',
              '("portrait-upload.html", "portrait-upload.js", "20260829-phase22"),',
              '("portrait-upload.html", "portrait-upload.js", "20260909-step9"),',
          )

          replace_exact(
              'backend/tests/contracts/test_phase18_ceo_fulfillment_review_control.py',
              '''                    "20260829-phase22"\n                    if asset == "portrait-upload.js"''',
              '''                    "20260909-step9"\n                    if asset == "portrait-upload.js"''',
          )

          replace_exact(
              'backend/tests/test_dashboard_and_client_security_integrity.py',
              '''    "link-keys.html": {"link-keys.js": "20260823-phase13-1"},\n    "portrait-upload.html": {\n        "auth.js": "20260829-phase22",\n        "portrait-upload.js": "20260829-phase22",\n    },\n    "verification-upload.html": {\n        "auth.js": "20260829-phase22",\n        "verification-upload.js": "20260829-phase22",\n    },\n    "vault-upload.html": {\n        "auth.js": "20260829-phase22",\n        "vault-upload.js": "20260829-phase22",\n    },''',
              '''    "link-keys.html": {"link-keys.js": "20260823-phase13-1"},\n    "upload-hub.html": {\n        "app.js": "20260907-auth-hardening",\n        "auth.js": "20260907-auth-hardening",\n    },\n    "portrait-upload.html": {\n        "app.js": "20260907-auth-hardening",\n        "auth.js": "20260907-auth-hardening",\n        "portrait-upload.js": "20260909-step9",\n    },\n    "verification-upload.html": {\n        "app.js": "20260907-auth-hardening",\n        "auth.js": "20260907-auth-hardening",\n        "verification-upload.js": "20260909-step9",\n    },\n    "vault-upload.html": {\n        "app.js": "20260907-auth-hardening",\n        "auth.js": "20260907-auth-hardening",\n        "vault-upload.js": "20260829-phase22",\n    },''',
          )

          replace_exact(
              'backend/tests/test_phase21_1_mobile_account_recovery.py',
              '''    ("portal-section.html", "app.js"): "20260907-auth-hardening",\n    ("portal-section.html", "auth.js"): "20260907-auth-hardening",\n}''',
              '''    ("portal-section.html", "app.js"): "20260907-auth-hardening",\n    ("portal-section.html", "auth.js"): "20260907-auth-hardening",\n    ("upload-hub.html", "app.js"): "20260907-auth-hardening",\n    ("upload-hub.html", "auth.js"): "20260907-auth-hardening",\n    ("portrait-upload.html", "app.js"): "20260907-auth-hardening",\n    ("portrait-upload.html", "auth.js"): "20260907-auth-hardening",\n    ("verification-upload.html", "app.js"): "20260907-auth-hardening",\n    ("verification-upload.html", "auth.js"): "20260907-auth-hardening",\n    ("vault-upload.html", "app.js"): "20260907-auth-hardening",\n    ("vault-upload.html", "auth.js"): "20260907-auth-hardening",\n}''',
          )
          PY
      - name: Remove temporary workflow and commit tests only
        run: |
          rm .github/workflows/step9-cache-contract-patch.yml
          git config user.name "tomboflight"
          git config user.email "thetomboflight@gmail.com"
          git add -A
          git diff --cached --name-only
          git commit -m "Step 9: align upload cache contracts with current assets"
          git push origin HEAD:fix/step9-upload-infrastructure
