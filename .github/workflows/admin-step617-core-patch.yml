name: Admin Step 617 Core Patch

on:
  push:
    branches:
      - fix/admin-review-workbench
    paths:
      - .github/workflows/admin-step617-core-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/admin-review-workbench
          fetch-depth: 0
      - name: Apply exact case-first patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Control Center: load the Step 617 visual/operator layer.
          replace_once(
              'admin-control-center.html',
              '    <link rel="stylesheet" href="admin-control-center-mobile.css?v=20260828-phase21-2" />',
              '    <link rel="stylesheet" href="admin-control-center-mobile.css?v=20260828-phase21-2" />\n    <link rel="stylesheet" href="admin-control-center-step617.css?v=20260909-step617" />',
          )

          replace_once(
              'admin-control-center.html',
              '''                    <p class="card-copy" data-admin-case-meta>\n                      Open a customer or project to isolate the record.\n                    </p>\n                    <div class="admin-case-action-grid" aria-label="Case command actions">''',
              '''                    <p class="card-copy" data-admin-case-meta>\n                      Open a customer or project to isolate the record.\n                    </p>\n                    <div class="admin-case-selection-controls">\n                      <button class="btn btn-secondary" type="button" data-admin-clear-case hidden>Close Selected Case</button>\n                    </div>\n                    <div class="admin-case-action-grid" aria-label="Case command actions">''',
          )

          replace_once(
              'admin-control-center.html',
              '''    <script src="admin-control-center.js?v=20260824-phase19-1"></script>\n    <script src="admin-operational-health.js?v=20260909-operational-health"></script>''',
              '''    <script src="admin-control-center.js?v=20260909-step617"></script>\n    <script src="admin-control-center-guide.js?v=20260909-step617"></script>\n    <script src="admin-operational-health.js?v=20260909-operational-health"></script>''',
          )

          # Render a search-first landing state rather than an arbitrary customer list on Overview/Customer Cases.
          replace_once(
              'admin-control-center.js',
              '''    if (!cases.length) {\n      node.innerHTML = `\n        ${operationsPanel}\n        <div class="admin-empty-state">\n          <div class="card-number">C</div>\n          <h3>No case results</h3>\n          <p class="card-copy">No customer cases matched this queue/search.</p>\n        </div>\n      `;\n      return;\n    }''',
              '''    if (!cases.length) {\n      const searchFirst = ["overview", "customer_cases"].includes(state.queue) && getSearchValue().length < 2;\n      node.innerHTML = searchFirst\n        ? `\n          ${operationsPanel}\n          <div class="admin-search-first-state">\n            <span class="eyebrow">Case Finder</span>\n            <h3>Find the customer or record you intend to work on.</h3>\n            <p>Enter at least two characters from a name, email, project, family, order, session, wallet, token, or certificate. Tomb of Light will not open a customer profile until you explicitly select a result.</p>\n          </div>\n        `\n        : `\n          ${operationsPanel}\n          <div class="admin-empty-state">\n            <div class="card-number">C</div>\n            <h3>No case results</h3>\n            <p class="card-copy">No customer cases matched this queue/search.</p>\n          </div>\n        `;\n      return;\n    }''',
          )

          # Add an explicit way to leave a case context without refreshing the whole application.
          marker = '''  async function loadCaseWorkspace(caseId) {\n    if (!caseId) return;'''
          replacement = '''  function clearSelectedCase() {\n    state.selectedCaseId = "";\n    state.workspace = null;\n    renderCaseList();\n    renderCaseHeader();\n    renderCaseContext();\n    renderWorkspaceTab();\n    updateActionAvailability();\n    updateBulkActionAvailability();\n    clearPageStatus();\n  }\n\n  async function loadCaseWorkspace(caseId) {\n    if (!caseId) return;'''
          replace_once('admin-control-center.js', marker, replacement)

          # Overview and Customer Cases are privacy-minimized search-first surfaces.
          replace_once(
              'admin-control-center.js',
              '''    const meta = QUEUE_META[state.queue] || QUEUE_META.customer_cases;\n    setPageStatus(`Loading ${meta[0].toLowerCase()}...`, "info");''',
              '''    const searchValue = getSearchValue();\n    const searchFirstQueue = ["overview", "customer_cases"].includes(state.queue);\n    if (searchFirstQueue && searchValue.length < 2) {\n      state.cases = [];\n      state.selectedCaseId = "";\n      state.workspace = null;\n      renderCaseList();\n      renderCaseHeader();\n      renderCaseContext();\n      renderWorkspaceTab();\n      updateActionAvailability();\n      updateBulkActionAvailability();\n      clearPageStatus();\n      return;\n    }\n    const meta = QUEUE_META[state.queue] || QUEUE_META.customer_cases;\n    setPageStatus(`Loading ${meta[0].toLowerCase()}...`, "info");''',
          )

          # Never auto-open the first case returned by a query/queue.
          replace_once(
              'admin-control-center.js',
              '''      renderCaseList();\n      if (!state.selectedCaseId && state.cases.length) {\n        await loadCaseWorkspace(state.cases[0].case_id);\n      } else if (state.selectedCaseId) {\n        const stillExists = state.cases.find(function (item) {\n          return item.case_id === state.selectedCaseId;\n        });\n        if (stillExists) {\n          await loadCaseWorkspace(state.selectedCaseId);\n        } else if (state.cases.length) {\n          await loadCaseWorkspace(state.cases[0].case_id);\n        }\n      }\n      renderCaseContext();''',
              '''      const stillExists = state.selectedCaseId\n        ? state.cases.find(function (item) { return item.case_id === state.selectedCaseId; })\n        : null;\n      if (state.selectedCaseId && !stillExists) {\n        state.selectedCaseId = "";\n        state.workspace = null;\n      }\n      renderCaseList();\n      if (state.selectedCaseId && stillExists) {\n        await loadCaseWorkspace(state.selectedCaseId);\n      }\n      renderCaseContext();''',
          )

          # Switching queues always clears the prior customer context.
          replace_once(
              'admin-control-center.js',
              '''        state.queue = queue;\n        applyRailSelection();\n        loadCases();''',
              '''        state.queue = queue;\n        state.selectedCaseId = "";\n        state.workspace = null;\n        applyRailSelection();\n        renderCaseHeader();\n        renderCaseContext();\n        renderWorkspaceTab();\n        updateActionAvailability();\n        loadCases();''',
          )

          # Close Selected Case is an explicit context-release action.
          replace_once(
              'admin-control-center.js',
              '''      const openCaseButton = target.closest("[data-open-case]");\n      if (openCaseButton) {\n        const caseId = openCaseButton.getAttribute("data-open-case");\n        if (caseId) loadCaseWorkspace(caseId);\n        return;\n      }\n\n      const caseRow = target.closest("[data-case-row]");''',
              '''      const clearCaseButton = target.closest("[data-admin-clear-case]");\n      if (clearCaseButton) {\n        clearSelectedCase();\n        return;\n      }\n\n      const openCaseButton = target.closest("[data-open-case]");\n      if (openCaseButton) {\n        const caseId = openCaseButton.getAttribute("data-open-case");\n        if (caseId) loadCaseWorkspace(caseId);\n        return;\n      }\n\n      const caseRow = target.closest("[data-case-row]");''',
          )

          # Internal Account Security should not retain customer navigation/actions.
          replace_once(
              'customer-account-step5.js',
              '''    if (activityStatus) {\n      activityStatus.textContent = "Internal account recognized. Customer-only security history endpoints are not used for this identity.";\n    }\n  }''',
              '''    if (activityStatus) {\n      activityStatus.textContent = "Internal account recognized. Customer-only security history endpoints are not used for this identity.";\n    }\n\n    const nav = document.getElementById("site-nav");\n    if (nav) {\n      nav.innerHTML =\n        '<a href="dashboard.html">Admin Workspace</a>' +\n        '<a href="admin-control-center.html">Control Center</a>' +\n        '<a href="admin-family-manager.html">Family Manager</a>' +\n        '<a href="admin-portrait-review.html">Portrait Review</a>' +\n        '<a href="admin-verification-review.html">Evidence Review</a>';\n    }\n    const dataRequestLink = document.querySelector("[data-account-data-requests-link]");\n    if (dataRequestLink) dataRequestLink.hidden = true;\n    const signInLink = document.querySelector('.header-actions a[href="signin.html"]');\n    if (signInLink) signInLink.hidden = true;\n  }''',
          )
          PY

      - name: Remove staging workflow
        shell: bash
        run: |
          rm -f .github/workflows/admin-step617-core-patch.yml
          git config user.name "tomboflight"
          git config user.email "thetomboflight@gmail.com"
          git add admin-control-center.html admin-control-center.js customer-account-step5.js .github/workflows/admin-step617-core-patch.yml
          git diff --cached --check
          git commit -m "Admin: enforce case-first command center behavior"
          git push origin HEAD:fix/admin-review-workbench
