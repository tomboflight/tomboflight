name: Continuity Kernel Guardrails

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  continuity-kernel-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile backend modules
        run: python -m compileall backend/app backend/scripts

      - name: Run architecture guardrail tests
        run: python -m unittest discover -s backend/tests/architecture -p "test_*.py" -v

      - name: Run contract guardrail tests
        run: python -m unittest discover -s backend/tests/contracts -p "test_*.py" -v

  continuity-kernel-runtime-route-test-env:
    runs-on: ubuntu-latest
    env:
      CONTINUITY_KERNEL_RUNTIME_TEST_ENFORCE_NO_SKIPS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==9.1.1
          python -m pip check

      - name: Run focused Phase 6I runtime route test (verified by Phase 6J)
        run: python -m unittest backend.tests.contracts.test_continuity_kernel_phase6i_runtime_route_verification -v

      - name: Run Phase 6L runtime no-skip enforcement test
        run: python -m unittest backend.tests.contracts.test_continuity_kernel_phase6l_runtime_no_skip_enforcement -v

      - name: Run full backend regression suite
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  dependency-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit pinned backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt

  admin-control-center-browser-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install browser verification dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify public customer workflows in a browser
        run: npm run test:browser
