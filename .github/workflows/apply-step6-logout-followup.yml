name: Apply Step 6 Logout Follow-up

on:
  push:
    branches:
      - audit-remediation/06-logout-revocation-integrity

permissions:
  contents: write

jobs:
  apply-followup:
    if: github.event.head_commit.message == 'Apply Step 6 logout follow-up'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply audited follow-up
        run: python backend/scripts/apply_step6_logout_followup.py

      - name: Validate source and focused contract
        run: |
          node --check app.js
          node --check link-keys.js
          python -m pip install pytest==9.1.1
          python -m pytest backend/tests/contracts/test_logout_revocation_client_contract.py -q
          git diff --check

      - name: Commit corrected implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js \
            link-keys.js \
            backend/tests/contracts/test_logout_revocation_client_contract.py
          git commit -m "Preserve cookie logout credentials and remove duplicate handler"
          git push origin "HEAD:${GITHUB_REF_NAME}"
