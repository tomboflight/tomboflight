name: Step 9 Wire Upload Hub

on:
  push:
    branches:
      - fix/step9-upload-infrastructure

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/step9-upload-infrastructure
      - name: Wire read-only Upload Hub overview
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('upload-hub.html')
          text = path.read_text(encoding='utf-8')
          old = '    <script src="auth.js?v=20260907-auth-hardening"></script>\n  </body>'
          new = '    <script src="auth.js?v=20260907-auth-hardening"></script>\n    <script src="upload-hub.js?v=20260909-step9"></script>\n  </body>'
          if text.count(old) != 1:
              raise SystemExit(f'upload-hub.html: expected one footer insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/step9-wire-upload-hub.yml
          git config user.name "tomboflight"
          git config user.email "thetomboflight@gmail.com"
          git add -A
          git commit -m "Step 9: wire authorized upload inventory overview"
          git push origin HEAD:fix/step9-upload-infrastructure
